# A JTAG slot of probehive (slots 4 and 5 in the ci layout), through scripts/dap_bridge.py, which
# listens on 4441 plus the slot's number:
#
#   python3 scripts/dap_bridge.py --slots 6 &
#   openocd -c "set SLOT 4" -f openocd/probehive-jtag.cfg -f target/esp32.cfg
#
# The bridge's ports for six slots, 4441-4446, take OpenOCD's telnet port 4444, so telnet moves
# to 4450.
if {![info exists SLOT]} { set SLOT 4 }
adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host 127.0.0.1
cmsis-dap tcp port [expr {4441 + $SLOT}]
transport select jtag
adapter speed 20000
telnet_port 4450
