# An SWD slot of probehive, through scripts/dap_bridge.py, which listens on 4441 plus the slot's
# number:
#
#   python3 scripts/dap_bridge.py --slots 6 &
#   openocd -c "set SLOT 0" -f openocd/probehive-swd.cfg -f target/rp2040.cfg
#
# OpenOCD's TCP backend is newer than 0.12.0; the flake builds OpenOCD from master.  Its default
# port is broken there (one-level STRINGIFY makes it the string "CMSIS_DAP_TCP_PORT"), so the
# port is named.  The bridge's ports for six slots, 4441-4446, take OpenOCD's telnet port 4444, so
# telnet moves to 4450.
if {![info exists SLOT]} { set SLOT 0 }
adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host 127.0.0.1
cmsis-dap tcp port [expr {4441 + $SLOT}]
transport select swd
adapter speed 10000
telnet_port 4450
